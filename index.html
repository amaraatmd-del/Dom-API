<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>luma.</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="min-h-screen min-w-[1440px] bg-[#F7F8F3] font-['DM_Sans',sans-serif] text-[#1C1C1A]"
  >
    <div class="mx-auto w-[1440px]">
      <header
        class="flex h-[72px] items-center w-[1440px] gap-3 border-b border-black/10"
      >
        <div
          class="flex h-[36px] w-[36px] items-center ml-[48px] justify-center rounded-[10px] bg-[#6B813B] text-white"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m10 20-1.25-2.5L6 18" />
            <path d="M10 4 8.75 6.5 6 6" />
            <path d="m14 20 1.25-2.5L18 18" />
            <path d="m14 4 1.25 2.5L18 6" />
            <path d="m17 21-3-6h-4" />
            <path d="m17 3-3 6 1.5 3" />
            <path d="M2 12h6.5L10 9" />
            <path d="m20 10-1.5 2 1.5 2" />
            <path d="M22 12h-6.5L14 15" />
            <path d="m4 10 1.5 2L4 14" />
            <path d="m7 21 3-6-1.5-3" />
            <path d="m7 3 3 6h4" />
          </svg>
        </div>
        <span class="text-[30px] font-bold tracking-tight"
          >luma<span class="text-[#6B813B]">.</span></span
        >
      </header>

      <div
        class="flex items-center h-[51px] w-[1440px] justify-between gap-8 border-b border-black/10 py-10"
      >
        <span
          class="text-[44px] ml-[48px] font-medium leading-none tracking-tight"
        >
          Find your next <span class="text-[#6B813B]">inspiration.</span>
        </span>
        <div
          class="flex w-[600px] shrink-0 items-center gap-3 rounded-[20px] border border-black/10 bg-white p-2 pl-5"
        >
          <svg
            class="text-[#8A8A82]"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>

          <input
            id="searchInput"
            type="text"
            placeholder="Search photos…"
            class="min-w-0 flex-1 bg-transparent text-[16px] placeholder:text-[#8A8A82] focus:outline-none"
          />
          <button
            id="searchBtn"
            type="button"
            class="flex h-[48px] shrink-0 cursor-pointer items-center gap-2 rounded-[14px] bg-[#E0F59A] px-6 font-semibold text-[#1C2A0A] hover:brightness-95"
          >
            Search
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M7 17 17 7M8 7h9v9" />
            </svg>
          </button>
        </div>
      </div>
      <div id="talbar" class="columns-3 mt-6"></div>

<button
    id="loadMoreBtn"
    type="button"
    class="mx-auto my-10 flex h-[48px] w-[152px] shrink-0 cursor-pointer items-center justify-center rounded-[14px] bg-[#D9F583] px-6 font-semibold text-[14px] text-[#1C2A0A] hover:brightness-95"
>
  Load More
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 18L12 22L16 18" />
    <path d="M12 2V22" />
  </svg>
</button>
    </div>
  </body>
</html>
